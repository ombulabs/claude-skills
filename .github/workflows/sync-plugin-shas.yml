name: Sync plugin SHAs

on:
  schedule:
    - cron: "0 12 * * 1-5" # weekdays at noon UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for SHA updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPDATED=false
          SUMMARY=""

          declare -A PLUGINS=(
            ["dual-boot"]="ombulabs/claude-code_dual-boot-skill"
            ["rails-load-defaults"]="ombulabs/claude-code_rails-load-defaults-skill"
            ["rails-upgrade"]="ombulabs/claude-code_rails-upgrade-skill"
          )

          for PLUGIN in "${!PLUGINS[@]}"; do
            REPO="${PLUGINS[$PLUGIN]}"
            LATEST_SHA=$(gh api "repos/$REPO/commits/main" --jq .sha)

            CURRENT_SHA=$(jq -r \
              --arg name "$PLUGIN" \
              '.plugins[] | select(.name == $name) | .source.sha' \
              .claude-plugin/marketplace.json)

            if [ "$LATEST_SHA" != "$CURRENT_SHA" ]; then
              UPDATED=true
              SHORT_OLD=$(echo "$CURRENT_SHA" | cut -c1-8)
              SHORT_NEW=$(echo "$LATEST_SHA" | cut -c1-8)
              SUMMARY="$SUMMARY- **$PLUGIN**: $SHORT_OLD -> $SHORT_NEW\n"

              jq --arg name "$PLUGIN" \
                 --arg sha "$LATEST_SHA" \
                 '(.plugins[] | select(.name == $name) | .source.sha) = $sha' \
                 .claude-plugin/marketplace.json > tmp.json \
                 && mv tmp.json .claude-plugin/marketplace.json
            fi
          done

          echo "updated=$UPDATED" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit and push to main
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "Update plugin SHAs to latest main"
          git push
